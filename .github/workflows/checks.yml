name: Kaisen checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: kaisen-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Validate Pages artifact and revision manifest
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: node scripts/prepare-pages.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kaisen-browser-${{ github.event.pull_request.head.sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
